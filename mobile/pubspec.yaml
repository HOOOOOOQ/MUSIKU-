name: musiku_plus
description: MUSIKU+ music and anime client
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # Pinned to the 6.x API actually used in core/google_auth.dart
  # (GoogleSignIn(serverClientId: ...) + signIn()/authentication.idToken).
  # 7.x/8.x replace signIn() with authenticate(), so a major bump is a code
  # change, not a dependency refresh.
  google_sign_in: '>=6.3.0 <7.0.0'
  go_router: ^14.8.1
  dio: ^5.8.0
  just_audio: ^0.9.46
  audio_service: ^0.18.17
  video_player: ^2.9.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
dev_dependencies:
  mocktail: ^1.0.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
