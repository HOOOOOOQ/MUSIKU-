name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Secret handling rules enforced by this workflow:
#   * secrets are injected only into the jobs that need them (per-step `env:`);
#   * no `echo` of a secret, and no step prints an environment value;
#   * MONGODB_URI / JWT_SECRET / JWT_REFRESH_SECRET are backend-only and are
#     never passed to `--dart-define`, so they cannot reach the APK (an explicit
#     scan step proves it);
#   * keystores and signing properties are temporary files, never artifacts, and
#     are deleted on success and failure.
jobs:
  config-audit:
    name: Configuration audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      atlas_ready: ${{ steps.audit.outputs.atlas_ready }}
      google_ready: ${{ steps.audit.outputs.google_ready }}
      android_google_ready: ${{ steps.audit.outputs.android_google_ready }}
      jwt_ready: ${{ steps.audit.outputs.jwt_ready }}
      signing_ready: ${{ steps.audit.outputs.signing_ready }}
      api_base_url_ready: ${{ steps.audit.outputs.api_base_url_ready }}
      all_required_ready: ${{ steps.audit.outputs.all_required_ready }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify required configuration is present (values are never printed)
        id: audit
        env:
          STRICT: ${{ github.event_name != 'pull_request' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID_VAR: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL || vars.API_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_BUILD_TOKEN: ${{ secrets.GITHUB_BUILD_TOKEN }}
        run: python3 scripts/audit_ci_config.py | tee -a "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Unit and API tests (hermetic, fake persistence)
        run: npm test
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  atlas-integration:
    name: MongoDB Atlas integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # MONGODB_URI and the JWT secrets reach this job only. The suite writes to
      # the isolated database named below, never to production data.
      - name: Atlas pre-flight and integration suite
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MONGODB_TEST_DB_NAME: musiku_plus_ci_test
          ATLAS_PROBE_TIMEOUT_MS: 15000
        run: |
          set +e
          npm run test:atlas:integration 2>&1 | tee ci-atlas.log
          status=${PIPESTATUS[0]}
          if [[ "$status" != 0 ]]; then
            python3 ../scripts/ci_notice.py ci-atlas.log 'Atlas integration' 'FAILURE'
          fi
          exit "$status"
      # Publishes the honest outcome (live run vs. skipped, with the recorded
      # reason) as an annotation and job summary — counts only, never values.
      - name: Report Atlas outcome
        if: always()
        run: python3 ../scripts/report_atlas_outcome.py ci-atlas.log tests/atlas/preflight.json

  admin:
    name: Admin build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The APK is only built when the mandatory backend and admin gates passed.
    needs: [backend, admin]
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      # Public build-time configuration only. The web client ID is a public
      # identifier (it ships inside the APK); the API origin is a URL.
      API_BASE_URL: ${{ vars.API_BASE_URL || vars.API_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter --version | tee ci-logs/toolchain.log
          flutter pub get 2>&1 | tee ci-logs/pub-get.log
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee ci-logs/format.log
      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee ci-logs/analyze.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::notice title=Flutter analyzer::$line"
          done < ci-logs/analyze.log
          exit "$status"
      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee ci-logs/tests.log
          status=${PIPESTATUS[0]}
          if [[ "$status" != 0 ]]; then
            python3 ../scripts/ci_notice.py ci-logs/tests.log 'Flutter tests'
          fi
          exit "$status"
      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug \
            --dart-define="API_BASE_URL=${API_BASE_URL:-https://api.example.invalid/api}" \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" 2>&1 | tee ci-logs/debug-build.log
          status=${PIPESTATUS[0]}
          if [[ "$status" != 0 ]]; then
            python3 ../scripts/ci_notice.py ci-logs/debug-build.log 'Android debug build' 'FAILURE'
            exit "$status"
          fi
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Prove no backend secret is embedded in the APK
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYMENT_SECRET_KEY: ${{ secrets.PAYMENT_SECRET_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GITHUB_BUILD_TOKEN: ${{ secrets.GITHUB_BUILD_TOKEN }}
        run: |
          set -o pipefail
          python3 ../scripts/scan_apk_secrets.py build/app/outputs/flutter-apk/app-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record APK metadata
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          {
            echo "### Debug APK"
            echo ""
            echo "- Path: \`mobile/$apk\`"
            echo "- Size: $(stat -c%s "$apk") bytes"
            echo "- SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
            echo "- API_BASE_URL baked in: ${API_BASE_URL:-not set (non-functional example.invalid default)}"
            echo "- GOOGLE_WEB_CLIENT_ID baked in: $([[ -n "$GOOGLE_WEB_CLIENT_ID" ]] && echo yes || echo 'no (Google button hidden)')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: musiku-plus-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Check signing availability
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo "### Release signing"
              echo ""
              echo "Not configured (or not usable on a pull request): debug artifact only."
              echo "No signing key was generated and the debug keystore is never used to sign a release build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/musiku-release.jks" android/key.properties' EXIT
          python3 ../scripts/configure_signing.py
          set +e
          flutter build apk --release \
            --dart-define="API_BASE_URL=${API_BASE_URL:-https://api.example.invalid/api}" \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" 2>&1 | tee ci-logs/release-build.log
          status=${PIPESTATUS[0]}
          if [[ "$status" != 0 ]]; then
            python3 ../scripts/ci_notice.py ci-logs/release-build.log 'Android release build' 'FAILURE'
            exit "$status"
          fi
          test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Scan the release APK for embedded secrets
        if: steps.signing.outputs.ready == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYMENT_SECRET_KEY: ${{ secrets.PAYMENT_SECRET_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 ../scripts/scan_apk_secrets.py build/app/outputs/flutter-apk/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: musiku-plus-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/musiku-release.jks" android/key.properties
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: musiku-plus-android-build-logs
          path: mobile/ci-logs/*.log
          retention-days: 7
