name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      API_URL: ${{ vars.API_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter --version | tee ci-logs/toolchain.log
          flutter pub get 2>&1 | tee ci-logs/pub-get.log
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee ci-logs/format.log
      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee ci-logs/analyze.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::notice title=Flutter analyzer::$line"
          done < ci-logs/analyze.log
          exit "$status"
      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee ci-logs/tests.log
          status=${PIPESTATUS[0]}
          if [[ "$status" != 0 ]]; then
            python3 -c "from pathlib import Path; text=Path('ci-logs/tests.log').read_text()[-10000:]; print('::notice title=Flutter tests::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))"
          fi
          exit "$status"
      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug --dart-define="API_URL=${API_URL:-https://api.example.invalid/api}" --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" 2>&1 | tee ci-logs/debug-build.log
          status=${PIPESTATUS[0]}
          if [[ "$status" != 0 ]]; then
            python3 -c "from pathlib import Path; text=''.join(Path('ci-logs/debug-build.log').read_text().splitlines(keepends=True)[-55:]); print('::notice title=Android debug build::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))"
            exit "$status"
          fi
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: musiku-plus-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Check signing availability
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing not configured or unavailable for pull requests; debug artifact only.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/musiku-release.jks" android/key.properties' EXIT
          python3 ../scripts/configure_signing.py
          flutter build apk --release --dart-define="API_URL=${API_URL:-https://api.example.invalid/api}" --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" 2>&1 | tee ci-logs/release-build.log
          test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: musiku-plus-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/musiku-release.jks" android/key.properties
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: musiku-plus-android-build-logs
          path: mobile/ci-logs/*.log
          retention-days: 7
